name: Auto Test VLESS

on:
  schedule:
    # Запуск каждые 5 часов (синхронизировано с конвертацией)
    - cron: '0 */5 * * *'
  workflow_dispatch: # Ручной запуск

jobs:
  test-and-save:
    runs-on: ubuntu-latest
    
    # Ждём завершения конвертации, чтобы тестировать актуальные ноды
    needs: []
    
    permissions:
      contents: write
      
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests maxminddb PySocks

      - name: Install Xray-core CLI
        run: |
          # Устанавливаем jq для парсинга JSON
          sudo apt-get update && sudo apt-get install -y jq unzip
          
          # Скачиваем последнюю версию Xray-core
          XRAY_VERSION=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          curl -L "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" -o xray.zip
          unzip xray.zip
          chmod +x xray
          sudo mv xray /usr/local/bin/xray
          
          # Удаляем временные файлы
          rm -rf xray.zip LICENSE README.md geoip.dat geosite.dat
          
          # Проверяем корректность установки
          xray version

      - name: Test nodes
        run: |
          python python/testers/vless_node_tester.py \
            vless_reality_tun.json \
            --output latest_results.json \
            --workers 20 \
            --timeout 5 \
            --min-ports 1

      - name: Commit and push if changed
        run: |
          # Корректная настройка бота GitHub Actions
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Добавляем сгенерированные JSON-отчеты
          git add *.json
          
          # Проверяем изменения. Если они есть — коммитим и пушим.
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита."
          else
            git commit -m "Auto-update VLESS test results [skip ci]"
            git push
          fi
