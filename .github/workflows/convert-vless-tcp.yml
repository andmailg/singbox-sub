name: Auto Convert Sing-Box VLESS TCP (Reality)

on:
  schedule:
    # Запуск каждые 2 часа
    - cron: '0 */2 * * *'
  workflow_dispatch: # Ручной запуск

jobs:
  convert:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests maxminddb
          curl -L https://git.io/GeoLite2-Country.mmdb -o GeoLite2-Country.mmdb

      - name: Install Xray CLI
        run: |
          curl -L https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o xray.zip
          unzip xray.zip -d xray
          sudo mv xray/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray

      - name: Run full pipeline
        run: |
          cd python
          # Генерирует 2 файла в корне репозитория:
          #   vless_tcp_tun.json — sing-box TUN конфиг
          #   vless_tcp.txt      — V2Ray-ссылки
          python vless_reality_manage.py run --timeout 3

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vless_tcp_tun.json vless_tcp.txt python/src/vless_reality_working.json
          
          if git diff --cached --quiet; then
            echo "Нет изменений для коммита."
          else
            git commit -m "Auto-update vless_reality configs & working nodes"
            git push
          fi
