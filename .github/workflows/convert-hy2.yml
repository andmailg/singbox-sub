name: Auto Convert Xray to Sing-Box Hy2

on:
  schedule:
    # Запуск каждые 2 час
    - cron: '0 */2 * * *'
  workflow_dispatch: # Ручной запуск

jobs:
  convert:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests maxminddb
      
      - name: Install Hysteria2 CLI
        run: |
          curl -L https://github.com/HyNetworks/hysteria/releases/download/app%2Fv2.12.3/hysteria-linux-amd64 -o hy2
          chmod +x hy2
          sudo mv hy2 /usr/local/bin/hy2
          hy2 version

      - name: Merge new nodes from subscriptions
        run: |
          cd python
          python hy2_manage.py merge

      - name: Test all working nodes
        run: |
          cd python
          python hy2_manage.py test --timeout 10

      - name: Export configs
        run: |
          cd python
          python hy2_manage.py export --type all --output ../hy2_tun.json

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add hy2_tun.json hy2.txt config.json python/src/hy2_working.json
          
          if git diff --cached --quiet; then
            echo "Нет изменений для коммита."
          else
            git commit -m "Auto-update hy2 configs & working nodes"
            git push
          fi
