name: Auto Convert Xray to Sing-Box Hy2

on:
  schedule:
    # Запуск каждые 5 часов
    - cron: '0 */5 * * *'
  workflow_dispatch: # Ручной запуск

jobs:
  convert:
    runs-on: ubuntu-latest
    
    # Права на запись оставляем, они необходимы для git push
    permissions:
      contents: write
      
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Ошибочная строка кэша удалена

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests maxminddb
      
      - name: Install Hysteria2 CLI
        run: |
          curl -L https://github.com/HyNetworks/hysteria/releases/download/app%2Fv2.12.3/hysteria-linux-amd64 -o hy2
          # Делаем файл исполняемым и переносим в системную директорию
          chmod +x hy2
          sudo mv hy2 /usr/local/bin/hy2
          
          # Проверяем корректность установки
          hy2 version

      - name: Merge new nodes from subscriptions
        run: |
          cd python
          python hy2_manage.py merge

      - name: Test all working nodes
        run: |
          cd python
          python hy2_manage.py test --timeout 10 --stale-days 14

      - name: Export configs
        run: |
          cd python
          python hy2_manage.py export --type tun --output ../hy2_tun.json
          python hy2_manage.py export --type router --output ../config.json
          python hy2_v2ray.py

      - name: Commit and push if changed
        run: |
          # Настройка бота GitHub Actions
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"

          # Добавляем файлы в индекс
          git add hy2_tun.json hy2.txt config.json hy2_working.json
          
          # Коммитим и пушим только при наличии изменений
          if git diff --cached --quiet; then
            echo "Нет изменений для коммита."
          else
            git commit -m "Auto-update hy2 configs & working nodes"
            git push
          fi

