name: Auto Convert Sing-Box Hysteria2

on:
  schedule:
    # Запуск каждые 2 часа со сдвигом в 20 минут (в 00:20, 02:20, 04:20 и т.д.)
    - cron: '20 */2 * * *'
  workflow_dispatch: # Ручной запуск

jobs:
  convert:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests maxminddb
          curl -L https://git.io/GeoLite2-Country.mmdb -o python/GeoLite2-Country.mmdb
          curl -L https://git.io/GeoLite2-ASN.mmdb -o python/GeoLite2-ASN.mmdb
      
      - name: Install Hysteria2 CLI
        run: |
          curl -L https://github.com/HyNetworks/hysteria/releases/download/app%2Fv2.12.3/hysteria-linux-amd64 -o hy2
          chmod +x hy2
          sudo mv hy2 /usr/local/bin/hy2

      - name: Run full pipeline
        run: |
          cd python
          # Генерирует 3 файла в корне репозитория:
          #   hy2_tun.json — sing-box TUN конфиг
          #   config.json  — sing-box SOCKS конфиг
          #   hy2.txt      — V2Ray-ссылки
          python hy2_manage.py run --timeout 3

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1. Фиксируем только нужные сгенерированные файлы в индекс (Staging)
          git add vless_tcp_tun.json vless_tcp.txt python/src/vless_tcp_working.json
          
          if git diff --cached --quiet; then
            echo "Нет изменений для коммита."
          else
            # 2. Создаем локальный коммит
            git commit -m "Auto-update vless_reality configs & working nodes"
            
            # 3. Сбрасываем изменения в недобавленных файлах (базах GeoLite2), чтобы они не мешали rebase
            git checkout -- python/GeoLite2-Country.mmdb python/GeoLite2-ASN.mmdb
            
            # 4. Безопасно подтягиваем изменения из GitHub и пушим
            git pull --rebase origin main
            git push origin main
          fi
