name: Auto Convert Xray to Sing-Box Hy2

on:
  schedule:
    # Запуск каждые 2 час
    - cron: '0 */2 * * *'
  workflow_dispatch: # Ручной запуск

jobs:
  convert:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests maxminddb
          curl -L https://git.io/GeoLite2-Country.mmdb -o GeoLite2-Country.mmdb
      
      - name: Install Hysteria2 CLI
        run: |
          curl -L https://github.com/HyNetworks/hysteria/releases/download/app%2Fv2.12.3/hysteria-linux-amd64 -o hy2
          chmod +x hy2
          sudo mv hy2 /usr/local/bin/hy2

      - name: Run full pipeline
        run: |
          cd python
          # Генерирует 3 файла в корне репозитория:
          #   hy2_tun.json — sing-box TUN конфиг
          #   config.json  — sing-box SOCKS конфиг
          #   hy2.txt      — V2Ray-ссылки
          python hy2_manage.py run --ports 443,8443,2053,2083,2087,2096,4433 --timeout 3

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add hy2_tun.json hy2.txt config.json python/src/hy2_working.json
          
          if git diff --cached --quiet; then
            echo "Нет изменений для коммита."
          else
            git commit -m "Auto-update hy2 configs & working nodes"
            git push
          fi
