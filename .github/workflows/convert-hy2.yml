name: Auto Convert Sing-Box Hysteria2

on:
  schedule:
    # Запуск каждые 2 часа
    - cron: '0 */2 * * *'
  workflow_dispatch: # Ручной запуск

# Не запускать два прогона одного workflow одновременно
concurrency:
  group: convert-hy2
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests maxminddb
          curl -fsSL --retry 3 https://git.io/GeoLite2-Country.mmdb -o python/GeoLite2-Country.mmdb
          curl -fsSL --retry 3 https://git.io/GeoLite2-ASN.mmdb -o python/GeoLite2-ASN.mmdb

      - name: Install Hysteria2 CLI
        run: |
          curl -fsSL --retry 3 https://github.com/HyNetworks/hysteria/releases/download/app%2Fv2.12.3/hysteria-linux-amd64 -o hy2
          sudo install -m 755 hy2 /usr/local/bin/hy2
          hy2 version

      - name: Run full pipeline
        working-directory: python
        run: >
          python hy2_manage.py run
          --geoip-block "ru" --rkn-filter 0 --export tun,xray,router
          --test-timeout 3 --blacklist-timeout 10 --whitelist-timeout 10

      - name: Commit and push if changed
        run: >
          bash .github/scripts/push_results.sh hy2 "Auto-update hy2 configs & working nodes"
          hy2_tun.json hy2.txt python/src/hy2_working.json python/src/hy2_pending.json config.json
