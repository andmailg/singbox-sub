name: Auto Convert Sing-Box VLESS gRPC

on:
  schedule:
    # Запуск каждые 5 часов
    - cron: '30 */5 * * *'
  workflow_dispatch: # Ручной запуск

# Не запускать два прогона одного workflow одновременно
concurrency:
  group: convert-vless-grpc
  cancel-in-progress: false

env:
  PROTO: vless_grpc
  OWN_FILES: vless_grpc_tun.json vless_grpc.txt python/src/vless_grpc_working.json python/src/vless_grpc_pending.json
  SHARED_FILES: python/src/filters/blacklist.json python/src/filters/whitelist.json

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests maxminddb
          curl -fsSL --retry 3 https://git.io/GeoLite2-Country.mmdb -o python/GeoLite2-Country.mmdb
          curl -fsSL --retry 3 https://git.io/GeoLite2-ASN.mmdb -o python/GeoLite2-ASN.mmdb

      - name: Install Xray CLI
        run: |
          curl -fsSL --retry 3 https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o xray.zip
          unzip -q xray.zip xray -d xray
          sudo install -m 755 xray/xray /usr/local/bin/xray
          xray version

      - name: Run full pipeline
        working-directory: python
        run: >
          python vless_grpc_manage.py run
          --geoip-block "ru" --rkn-filter 0 --export tun,xray
          --test-timeout 3 --blacklist-timeout 10 --whitelist-timeout 10

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Забираем результаты прогона: свои файлы целиком, общие — только секцию протокола
          mkdir -p /tmp/out
          cp --parents $OWN_FILES $SHARED_FILES /tmp/out/

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            (cd /tmp/out && cp --parents $OWN_FILES "$GITHUB_WORKSPACE"/)
            python python/sync_shared.py "$PROTO" /tmp/out

            git add $OWN_FILES $SHARED_FILES
            if git diff --cached --quiet; then
              echo "Нет изменений для коммита."
              exit 0
            fi
            git commit -m "Auto-update VLESS gRPC configs & working nodes"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push не удался (попытка $attempt), повтор..."
            sleep $((RANDOM % 20 + 5))
          done
          echo "::error::Не удалось отправить изменения после 5 попыток"
          exit 1
