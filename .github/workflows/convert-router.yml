name: Auto Convert Xray to Sing-Box Router

on:
  schedule:
    # Запуск каждые 5 часов
    - cron: '0 */5 * * *'
  workflow_dispatch: # Ручной запуск

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests maxminddb

      - name: Install Hysteria2 CLI
        run: |
          curl -L https://github.com/HyNetworks/hysteria/releases/download/app%2Fv2.12.3/hysteria-linux-amd64 -o hy2
          # Делаем файл исполняемым и переносим в системную директорию
          chmod +x hy2
          sudo mv hy2 /usr/local/bin/hy2
          
          # Проверяем корректность установки
          hy2 version

      - name: Run scripts
        run: |
          python python/hy2_router.py

      - name: Commit and push if changed
        run: |
          # 1. Настройка бота GitHub Actions
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 2. Добавляем файл в индекс
          git add config.json
          git status
          
          # 3. Коммитим и пушим только при наличии изменений
          if git diff --cached --quiet; then
            echo "Нет изменений для коммита."
          else
            git commit -m "Auto-update config.json"
            git push
          fi

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3
